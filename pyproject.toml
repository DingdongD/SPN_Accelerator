[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spn-accelerator-cmodel"
version = "0.1.0"
description = "Tile/event-level architectural CModel for dense tensor engines and SPN propagation engines"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
spn-cmodel = "spn_accel_cmodel.cli:main"

[tool.setuptools.packages.find]
include = ["spn_accel_cmodel*"]
